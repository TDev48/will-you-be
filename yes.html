<!DOCTYPE html>
<html>
<head>
<title>She Said YES 💖</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(135deg, #ff4da6, #6a5acd, #00c6ff);
  background-size: 400% 400%;
  animation: bgMove 6s infinite alternate;
}

/* 💖 Box */
.container {
  text-align: center;
  background: rgba(0,0,0,0.5);
  padding: 70px;
  border-radius: 30px;
  color: white;
  animation: pop 1s ease;
}

h1 {
  font-size: 60px;
  margin: 0;
}

p {
  font-size: 22px;
}

/* button */
button {
  margin-top: 25px;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-size: 18px;
  background: white;
  color: black;
}

/* 💓 hearts */
.heart {
  position: absolute;
  font-size: 24px;
  animation: floatUp 6s linear infinite;
}

/* animations */
@keyframes pop {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

@keyframes bgMove {
  0% { background-position: left; }
  100% { background-position: right; }
}
</style>
</head>

<body>

<div class="container">
  <h1>💖 SHE SAID YES 💖</h1>
  <p>This moment just became special ✨</p>

  <button onclick="goBack()">Go Back</button>
</div>

<script>
/* 🔥 make sure DOM is ready */
window.onload = () => {

  /* 🎉 strong confetti burst */
  confetti({
    particleCount: 300,
    spread: 120,
    origin: { y: 0.6 }
  });

  setTimeout(() => {
    confetti({
      particleCount: 200,
      spread: 100,
      origin: { y: 0.3 }
    });
  }, 500);

  /* 💓 hearts spam */
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 25) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }, 200);
};

/* 🔙 */
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
