<!DOCTYPE html>
<html>
<head>
<title>She Said YES 💖</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;

  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
}

/* 💖 Glass box */
.container {
  text-align: center;
  background: rgba(0,0,0,0.4);
  padding: 60px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  color: white;

  animation: fadeIn 1.5s ease;
}

h1 {
  font-size: 55px;
  margin-bottom: 20px;
  text-shadow: 3px 3px 10px black;
}

p {
  font-size: 25px;
}

/* 💖 Button */
button {
  margin-top: 30px;
  padding: 15px 35px;
  border: none;
  border-radius: 30px;
  font-size: 20px;
  cursor: pointer;
  background: #ff4da6;
  color: white;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

/* 💓 Floating hearts */
.heart {
  position: absolute;
  color: pink;
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

/* fade animation */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
  <h1>She said YES 💖</h1>
