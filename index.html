<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Girlfriend?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;

  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.container {
  text-align: center;
  background: rgba(255,255,255,0.25);
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}

h1 {
  color: white;
  text-shadow: 2px 2px 6px black;
}

button {
  padding: 12px 25px;
  margin: 10px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-size: 16px;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

#noBtn {
  background: #ff4d4d;
  color: white;
  position: absolute;
}

/* 🚨 overlay popup */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
}

#overlay img {
  width: 250px;
  border-radius: 20px;
  margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my girlfriend? 💖</h1>

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="moveNo()">No 😢</button>
</div>

<!-- 🚨 overlay instead of deleting page -->
<div id="overlay">
  <img src="1774912642938.png">
</div>

<script>
let noCount = 0;

function yes() {
  window.location.href = "yes.html";
}

function moveNo() {
  noCount++;

  const btn = document.getElementById("noBtn");

  // 🎯 move button randomly
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);

  btn.style.left = x + "px";
  btn.style.top = y + "px";

  // 🚨 show overlay after 4 clicks
  if (noCount >= 4) {
    document.getElementById("overlay").style.display = "flex";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 5000);
  }
}
</script>

</body>
</html>
