<!DOCTYPE html>
<html>
<head>
<title>Piyu💚 Do You Love Me?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
}

/* 💖 Container */
.container {
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.25);
  padding: 70px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  width: 80%;
  max-width: 700px;
}

h1 {
  color: white;
  text-shadow: 3px 3px 10px black;
  font-size: 50px;
}

/* 🔘 Buttons */
button {
  padding: 18px 40px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-size: 24px;
  margin: 10px;
  transition: transform 0.2s ease;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

#noBtn {
  background: #ff4d4d;
  color: white;
  position: absolute;
  top: 65%;
  left: 60%;
}

/* 🎭 Overlay */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 999;
}
</style>
</head>

<body>

<div class="container">
  <h1>Hi Piyumi❤️ I want you to stay with me forever like the moon stays with night.</h1>
  <h2>So</h2>
  <h3>Piyu💚 Would You Give Me Chance ? 💖</h3>

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="moveNo()">No 😢</button>
</div>

<div id="overlay">
  <img src="1774912642938.png" width="250">
  <h2>ඕකනෙ බැරි ඉතින් කොරන්ට 😒</h2>
</div>

<script>
let noCount = 0;
let yesScale = 1;

/* 🔁 Reset everything properly */
function resetGame() {
  noCount = 0;
  yesScale = 1;

  document.getElementById("overlay").style.display = "none";

  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  yesBtn.style.transform = "scale(1)";

  // reset NO button position
  noBtn.style.left = "60%";
  noBtn.style.top = "65%";
}

/* ✅ Always reset on load */
window.onload = resetGame;
window.onpageshow = resetGame;

/* 💖 YES CLICK */
function yes() {

  const name = "Piyumi"; // you can upgrade later with input

  /* 📱 WhatsApp message */
  const phone = "94715881939"; // your number
  const message = `Yes. I Will give you a chance ❤️`;

  const waLink = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

  window.open(waLink, "_blank");

  /* 🤖 Telegram notification (auto send) */
  const botToken = "7764980571:AAE3S4XB3JceFVyxh-L9t_HwTL7QnEae30s";
  const chatId = "7330082919";

  const telegramMessage = `🔥 ALERT!\n${name} said YES 💖`;

  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      chat_id: chatId,
      text: telegramMessage
    })
  });

  /* 🎉 Confetti */
  confetti({
    particleCount: 200,
    spread: 100
  });

  setTimeout(() => {
    window.location.href = "yes.html";
  }, 1200);
    }

/* 😢 NO CLICK */
function moveNo() {
  noCount++;

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  // 🎯 Small controlled movement (NEVER disappears)
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const radiusX = 120;
  const radiusY = 100;

  const x = centerX + (Math.random() - 0.5) * radiusX;
  const y = centerY + (Math.random() - 0.5) * radiusY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  // 💖 YES grows
  yesScale += 0.2;
  if (yesScale > 3) yesScale = 3;

  yesBtn.style.transform = `scale(${yesScale})`;

  // 🎭 Show overlay after 4 clicks
  if (noCount >= 4) {
    document.getElementById("overlay").style.display = "flex";

    setTimeout(() => {
      resetGame();
    }, 4000);
  }
}
</script>

</body>
</html>
