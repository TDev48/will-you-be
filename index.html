<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Girlfriend?</title>

<!-- 🎉 Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;

  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
}

/* 💖 Center box */
.container {
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  background: rgba(255,255,255,0.25);
  padding: 80px;
  border-radius: 30px;
  backdrop-filter: blur(10px);

  width: 80%;
  max-width: 700px;
}

h1 {
  color: white;
  text-shadow: 3px 3px 10px black;
  font-size: 60px;
  font-weight: bold;
}

/* 🔘 Buttons */
button {
  padding: 20px 50px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-size: 30px;
  margin: 15px;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

/* 🚨 IMPORTANT: No button fixed + visible */
#noBtn {
  background: #ff4d4d;
  color: white;
  position: absolute;
  top: 60%;
  left: 60%;
  transition: 0.2s;
}

/* 🎭 Overlay */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);

  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
  z-index: 999;
}

#overlay img {
  width: 250px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my girlfriend? 💖</h1>

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="moveNo()">No 😢</button>
</div>

<!-- 🎭 Overlay -->
<div id="overlay">
  <img src="1774912642938.png">
  <h2>ඕකනෙ බැරි ඉතින් කොරන්ට 😒</h2>
</div>

<script>
let noCount = 0;

function yes() {
  // 🎉 Confetti explosion
  confetti({
    particleCount: 200,
    spread: 100,
    origin: { y: 0.6 }
  });

  setTimeout(() => {
    confetti({ particleCount: 150, spread: 120, origin: { y: 0.6 } });
  }, 300);

  setTimeout(() => {
    window.location.href = "yes.html";
  }, 1200);
}

function moveNo() {
  noCount++;

  const btn = document.getElementById("noBtn");

  // 🚨 safe screen boundaries (prevents disappearing)
  const maxX = window.innerWidth - 120;
  const maxY = window.innerHeight - 120;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  btn.style.left = x + "px";
  btn.style.top = y + "px";

  // 🎭 show overlay after 4 clicks
  if (noCount >= 4) {
    document.getElementById("overlay").style.display = "flex";

    setTimeout(() => {
      location.reload(); // safe reset
    }, 5000);
