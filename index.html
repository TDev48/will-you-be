<!DOCTYPE html>
<html>
<head>
<title>Piyu💚 Will You Be My Girlfriend?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- ✅ Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
}

.container {
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.25);
  padding: 60px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  width: 80%;
  max-width: 700px;
}

h1 {
  color: white;
  text-shadow: 3px 3px 10px black;
  font-size: 50px;
}

/* ✅ INPUT */
#nameInput {
  padding: 15px;
  border-radius: 20px;
  border: none;
  font-size: 20px;
  margin-bottom: 20px;
  width: 80%;
  text-align: center;
}

/* BUTTONS */
button {
  padding: 18px 40px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-size: 24px;
  margin: 10px;
  transition: 0.2s;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

#noBtn {
  background: #ff4d4d;
  color: white;
  position: absolute;
  top: 60%;
  left: 60%;
}

/* OVERLAY */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}

/* NAMES LIST */
#namesList {
  color: white;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Piyu💚 Will you be my girlfriend? 💖</h1>

  <!-- ✅ CORRECT PLACE -->
  <input id="nameInput" type="text" placeholder="Enter your name 💖">

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="moveNo()">No 😢</button>

  <!-- ✅ LIVE NAMES -->
  <div id="namesList"></div>
</div>

<div id="overlay">
  <img src="1774912642938.png" width="250">
  <h2>ඕකනෙ බැරි ඉතින් කොරන්ට 😒</h2>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDn5le4hwFNS08_aQ6jpwADFGjaBp5o_3Q",
  authDomain: "track-my-web.firebaseapp.com",
  databaseURL: "https://track-my-web-default-rtdb.firebaseio.com/",
  projectId: "track-my-web"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let noCount = 0;

/* ✅ YES */
function yes() {
  const name = document.getElementById("nameInput").value;

  if (!name) {
    alert("Enter your name 💖");
    return;
  }

  db.ref("responses/users").push({
    name: name,
    answer: "YES",
    time: new Date().toLocaleString()
  });

  confetti({ particleCount: 200, spread: 100 });

  setTimeout(() => {
    window.location.href = "yes.html";
  }, 1200);
}

/* ❌ NO */
function moveNo() {
  noCount++;

  const name = document.getElementById("nameInput").value;

  if (name) {
    db.ref("responses/noUsers").push({
      name: name,
      answer: "NO",
      time: new Date().toLocaleString()
    });
  }

  const btn = document.getElementById("noBtn");

  // 🎯 SMALL MOVEMENT AREA
  const x = window.innerWidth / 2 + (Math.random() - 0.5) * 150;
  const y = window.innerHeight / 2 + (Math.random() - 0.5) * 120;

  btn.style.left = x + "px";
  btn.style.top = y + "px";

  if (noCount >= 3) {
    document.getElementById("overlay").style.display = "flex";
  }
}

/* ✅ LOAD NAMES SAFELY */
db.ref("responses/users").on("value", (snapshot) => {
  const data = snapshot.val();
  let html = "<h3>💖 People who said YES:</h3>";

  if (data) {
    for (let key in data) {
      html += "<p>" + data[key].name + "</p>";
    }
  } else {
    html += "<p>No responses yet 😢</p>";
  }

  document.getElementById("namesList").innerHTML = html;
});
</script>

</body>
</html>
