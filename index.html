<!DOCTYPE html>
<html>
<head>
<title>Piyu💚 Will You Be My Girlfriend?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
}

/* 💖 Main box */
.container {
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.25);
  padding: 80px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
  width: 80%;
  max-width: 700px;
}

h1 {
  color: white;
  text-shadow: 3px 3px 10px black;
  font-size: 60px;
  font-weight: bold;
}

/* 🔘 Buttons */
button {
  padding: 20px 50px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  font-size: 30px;
  margin: 15px;
  transition: transform 0.3s ease;
}

#yesBtn {
  background: #4CAF50;
  color: white;
  transform-origin: center;
}

#noBtn {
  background: #ff4d4d;
  color: white;
  position: absolute;
  top: 60%;
  left: 60%;
}

/* 🎭 Overlay */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);

  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
  z-index: 999;
}
</style>
</head>

<body>

<div class="container">
  <h1>Piyu💚 Will you be my girlfriend? 💖</h1>

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="moveNo()">No 😢</button>
</div>

<div id="overlay">
  <img src="1774912642938.png" width="250">
  <h2>ඕකනෙ බැරි ඉතින් කොරන්ට 😒</h2>
</div>

<script>
let noCount = 0;
let yesScale = 1;

function yes() {
  confetti({
    particleCount: 200,
    spread: 100,
    origin: { y: 0.6 }
  });

  setTimeout(() => {
    window.location.href = "yes.html";
  }, 1200);
}

function moveNo() {
  noCount++;

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  // 🚨 Move NO button safely
  const maxX = window.innerWidth - 120;
  const maxY = window.innerHeight - 120;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  // 💖 YES button grows each time NO is clicked
  yesScale += 0.15;
  yesBtn.style.transform = `scale(${yesScale})`;

  // optional: cap size so it doesn't break layout
  if (yesScale > 3) {
    yesScale = 3;
  }

  // 😂 overlay after multiple NO clicks
  if (noCount >= 5) {
    document.getElementById("overlay").style.display = "flex";

    setTimeout(() => {
      location.reload();
    }, 5000);
  }
}
</script>

</body>
</html>
