<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Girlfriend?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;

  /* 🌈 MILO BACKGROUND */
  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.container {
  text-align: center;
  background: rgba(255,255,255,0.25);
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

h1 {
  color: white;
  font-size: 28px;
  text-shadow: 2px 2px 6px black;
}

button {
  padding: 12px 25px;
  margin: 10px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

#noBtn {
  background: #ff4d4d;
  color: white;
}

button:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my girlfriend? 💖</h1>

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="noClick()">No 😢</button>
</div>

<script>
let noCount = 0;

function yes() {
  window.location.href = "yes.html";
}

function noClick() {
  noCount++;

  if (noCount >= 4) {
    document.body.innerHTML = `
      <div style="text-align:center; padding-top:100px;">
        <img src="your-image.jpg" style="width:250px;border-radius:20px;">
        <h2 style="color:white; text-shadow:2px 2px 5px black;">
          😂 Okay okay… I give up!
        </h2>
      </div>
    `;

    setTimeout(() => {
      window.location.href = "index.html";
    }, 5000);
  }
}
</script>

</body>
</html>
