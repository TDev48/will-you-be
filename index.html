<!DOCTYPE html>
<html>
<head>
<title>Will You Be My Girlfriend?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;

  background-image: url("e2e3e6cb7e480043d3bd883aa75e5647.jpg");
  background-size: cover;
  background-position: center;
}

.container {
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.25);
  padding: 40px;
  border-radius: 30px;
  backdrop-filter: blur(10px);
}

h1 {
  color: white;
  text-shadow: 2px 2px 6px black;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-size: 25px;
}

#yesBtn {
  background: #4CAF50;
  color: white;
}

#noBtn {
  background: #ff4d4d;
  color: white;
  position: absolute;
  transition: 0.2s;
}

/* overlay */
#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my girlfriend? 💖</h1>

  <button id="yesBtn" onclick="yes()">Yes 💕</button>
  <button id="noBtn" onclick="moveNo()">No 😢</button>
</div>

<div id="overlay">
  <img src="1774912642938.png" width="250" style="border-radius:20px;">
</div>

<script>
let noCount = 0;

function yes() {
  window.location.href = "yes.html";
}

function moveNo() {
  noCount++;

  const btn = document.getElementById("noBtn");

  const maxX = window.innerWidth - 100;
  const maxY = window.innerHeight - 50;

  btn.style.left = Math.random() * maxX + "px";
  btn.style.top = Math.random() * maxY + "px";

  if (noCount >= 4) {
    document.getElementById("overlay").style.display = "flex";

    setTimeout(() => {
      location.reload(); // safer than index.html redirect
    }, 5000);
  }
}
</script>

</body>
</html>
